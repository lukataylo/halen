name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Halen EQ — swift test
    # Halen EQ targets macOS 26 (SpeechAnalyzer, Foundation Models).
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: eq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            eq/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-eq-${{ runner.os }}-${{ hashFiles('eq/Package.swift', 'eq/Package.resolved') }}
          restore-keys: spm-eq-${{ runner.os }}-
      - run: swift --version
      - run: swift build
      - run: swift test
